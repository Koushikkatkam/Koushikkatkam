<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="telemetry-title telemetry-desc" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title id="telemetry-title">Digital Lab Architecture &amp; Core Disciplines</title>
  <desc id="telemetry-desc">Four core engineering quadrants in the Obsidian Aurora theme: AI and Data Science, Full-Stack Architecture, Systems and Cybersecurity, and Interactive WebGL 3D.</desc>
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43E7FF"/>
      <stop offset="100%" stop-color="#43E7FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="violet-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9475FF"/>
      <stop offset="100%" stop-color="#9475FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="amber-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB454"/>
      <stop offset="100%" stop-color="#FFB454" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mixed-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43E7FF"/>
      <stop offset="50%" stop-color="#9475FF"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="230" rx="16" fill="#080B14"/>

  <!-- Card 1: AI & Data Systems -->
  <g transform="translate(20, 20)">
    <rect width="270" height="190" rx="12" fill="url(#card-grad)" stroke="#43E7FF" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="18" y="18" width="60" height="18" rx="4" fill="#101827" stroke="#43E7FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#43E7FF">DISCIPLINE 01</text>
    <text x="18" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F2F6FF">AI &amp; Data Systems</text>
    <text x="18" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#9BA9BF">RAG · Multimodal · LLM Inference</text>
    <rect x="18" y="98" width="234" height="2" rx="1" fill="url(#cyan-bar)"/>
    <text x="18" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#43E7FF">◆ PyTorch · Google Gemini</text>
    <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ pgvector · NetCDF4/HDF5</text>
    <text x="18" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ Grounded RAG · Grad-CAM</text>
    <circle cx="248" cy="27" r="4" fill="#43E7FF"/>
  </g>

  <!-- Card 2: Full-Stack Architecture -->
  <g transform="translate(310, 20)">
    <rect width="270" height="190" rx="12" fill="url(#card-grad)" stroke="#9475FF" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="18" y="18" width="60" height="18" rx="4" fill="#101827" stroke="#9475FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#9475FF">DISCIPLINE 02</text>
    <text x="18" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F2F6FF">Full-Stack Platforms</text>
    <text x="18" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#9BA9BF">Modern Web · SSR · API Engines</text>
    <rect x="18" y="98" width="234" height="2" rx="1" fill="url(#violet-bar)"/>
    <text x="18" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9475FF">◆ Next.js 14 · React · Node</text>
    <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ TypeScript · Tailwind CSS</text>
    <text x="18" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ PostgreSQL · Prisma · Supabase</text>
    <circle cx="248" cy="27" r="4" fill="#9475FF"/>
  </g>

  <!-- Card 3: Systems & Security -->
  <g transform="translate(600, 20)">
    <rect width="270" height="190" rx="12" fill="url(#card-grad)" stroke="#FFB454" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="18" y="18" width="60" height="18" rx="4" fill="#101827" stroke="#FFB454" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFB454">DISCIPLINE 03</text>
    <text x="18" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F2F6FF">Systems &amp; Security</text>
    <text x="18" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#9BA9BF">Threat Intel · Native Harness · CLI</text>
    <rect x="18" y="98" width="234" height="2" rx="1" fill="url(#amber-bar)"/>
    <text x="18" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFB454">◆ Rust · Tokio · Native CLI</text>
    <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ FastAPI · Realtime SSE</text>
    <text x="18" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ Heuristic Analysis · SQLGuard</text>
    <circle cx="248" cy="27" r="4" fill="#FFB454"/>
  </g>

  <!-- Card 4: WebGL & Interactive 3D -->
  <g transform="translate(890, 20)">
    <rect width="290" height="190" rx="12" fill="url(#card-grad)" stroke="#43E7FF" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="18" y="18" width="60" height="18" rx="4" fill="#101827" stroke="#43E7FF" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#43E7FF">DISCIPLINE 04</text>
    <text x="18" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F2F6FF">Interactive &amp; 3D</text>
    <text x="18" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#9BA9BF">WebGL Shaders · Kinetic Canvas</text>
    <rect x="18" y="98" width="254" height="2" rx="1" fill="url(#mixed-bar)"/>
    <text x="18" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#43E7FF">◆ Three.js · React Three Fiber</text>
    <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ GLSL Shaders · 3D Threat Globe</text>
    <text x="18" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9BA9BF">◆ GSAP · Lenis · Particle Audio</text>
    <circle cx="268" cy="27" r="4" fill="#43E7FF"/>
  </g>
</svg>
